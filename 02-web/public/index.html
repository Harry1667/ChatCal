<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手帳 · ChatCal</title>
  <meta name="theme-color" content="#5c4a32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="手帳" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="book">
    <!-- 左頁：月曆 + 搜尋 + 近日 + 設定 -->
    <aside class="page page-left">
      <div class="masthead">
        <div class="brand">
          <div class="brand-zh">手帳</div>
          <div class="brand-en">ChatCal · journal</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="today-chip" id="todayChip">—</div>
          <button class="settings-btn" id="settingsBtn" title="設定">⚙ 設定</button>
        </div>
      </div>

      <section class="search">
        <input type="text" id="searchInput" placeholder="🔍 搜尋…" autocomplete="off" />
        <div class="search-results" id="searchResults" hidden></div>
      </section>

      <section class="calendar">
        <div class="cal-header">
          <button class="cal-nav" id="prevMonth">‹</button>
          <div class="cal-title" id="calTitle">—</div>
          <button class="cal-nav" id="nextMonth">›</button>
        </div>
        <div class="cal-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </section>

      <section class="upcoming">
        <div class="section-title">近日</div>
        <ul class="upcoming-list" id="upcomingList">
          <li class="muted">—</li>
        </ul>
      </section>

    </aside>

    <!-- 右頁：當天時間軸 + 反思 + 快速輸入 -->
    <main class="page page-right">
      <header class="day-head">
        <div class="day-date">
          <div class="day-number" id="dayNumber">—</div>
          <div class="day-meta">
            <div class="day-month" id="dayMonth">—</div>
            <div class="day-weekday" id="dayWeekday">—</div>
          </div>
        </div>
        <div class="day-pager">
          <button class="page-btn" id="prevDay">◁ 前一天</button>
          <button class="page-btn" id="goToday">今日</button>
          <button class="page-btn" id="nextDay">後一天 ▷</button>
        </div>
      </header>

      <section class="timeline" id="timeline">
        <div class="empty-state">
          <div class="empty-quill">✒︎</div>
          <div>今天手帳還空著。</div>
        </div>
      </section>

      <section class="reflection-card" id="reflectionCard">
        <div class="reflection-head">
          <span class="reflection-label">今日反思</span>
          <span class="reflection-mood" id="reflectionMood"></span>
        </div>
        <textarea id="reflectionText" placeholder="回頭看看這一天… 寫下心情與收穫"></textarea>
        <div class="reflection-actions">
          <div class="mood-picker" id="moodPicker">
            <span data-mood="😊">😊</span>
            <span data-mood="😌">😌</span>
            <span data-mood="🥲">🥲</span>
            <span data-mood="😤">😤</span>
            <span data-mood="😴">😴</span>
            <span data-mood="🎉">🎉</span>
            <span data-mood="💪">💪</span>
            <span data-mood="🌧️">🌧️</span>
          </div>
          <button id="saveReflection" class="btn-ghost">存</button>
        </div>
      </section>

      <footer class="quick-input">
        <input
          type="text"
          id="quickInput"
          placeholder="隨手寫一筆…例：明天下午三點跟教授討論論文，要帶筆電"
          autocomplete="off"
        />
        <button id="quickSubmit">寫入</button>
      </footer>
    </main>
  </div>

  <!-- 事件詳情 modal -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">—</div>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>標題</label>
          <input type="text" id="editTitle" />
        </div>
        <div class="field">
          <label>時間</label>
          <div class="time-range">
            <input type="datetime-local" id="editStart" />
            <span>～</span>
            <input type="datetime-local" id="editEnd" />
          </div>
        </div>
        <div class="field">
          <label>重複</label>
          <select id="editRepeat">
            <option value="none">不重複</option>
            <option value="daily">每天</option>
            <option value="weekly">每週</option>
            <option value="monthly">每月</option>
          </select>
        </div>
        <div class="field">
          <label>詳細說明</label>
          <textarea id="editDescription" rows="3"></textarea>
        </div>
        <div class="field">
          <label>手寫備註</label>
          <textarea id="editNotes" rows="3" placeholder="回頭補的想法、心得…"></textarea>
        </div>
        <div class="field">
          <label>狀態</label>
          <select id="editStatus">
            <option value="pending">待辦</option>
            <option value="done">完成</option>
            <option value="missed">錯過</option>
          </select>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-danger" id="btnDelete">刪除</button>
        <div class="spacer"></div>
        <button class="btn-ghost" id="btnCancel">取消</button>
        <button class="btn-primary" id="btnSave">儲存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- 設定 Modal -->
  <div class="settings-overlay" id="settingsOverlay" hidden>
    <div class="settings-panel">
      <div class="settings-hd">
        <span>設定</span>
        <button id="settingsClose">✕</button>
      </div>
      <div class="settings-tabs">
        <button class="stab active" data-tab="general">一般</button>
        <button class="stab" data-tab="aitalk">AI 交流設定</button>
        <button class="stab" data-tab="security">安全</button>
      </div>
      <div class="settings-body">

        <!-- 一般 -->
        <div class="stab-content active" id="tab-general">
          <div class="s-group">
            <div class="s-label">外觀</div>
            <div class="s-row">
              <label>深色模式</label>
              <label class="toggle">
                <input type="checkbox" id="darkModeToggle" />
                <span class="toggle-track"></span>
              </label>
            </div>
          </div>
          <div class="s-group">
            <div class="s-label">提醒時間</div>
            <div class="s-row">
              <label>☀️ 早報</label>
              <div class="time-input">
                <input type="number" id="briefHour" min="0" max="23" style="width:40px" />
                <span>:</span>
                <input type="number" id="briefMinute" min="0" max="59" style="width:40px" />
              </div>
            </div>
            <div class="s-row">
              <label>🌙 晚報</label>
              <div class="time-input">
                <input type="number" id="reflectHour" min="0" max="23" style="width:40px" />
                <span>:</span>
                <input type="number" id="reflectMinute" min="0" max="59" style="width:40px" />
              </div>
            </div>
            <div class="s-row">
              <label>📊 週回顧</label>
              <div class="time-input">
                <input type="number" id="weeklyHour" min="0" max="23" style="width:40px" />
                <span>:</span>
                <input type="number" id="weeklyMinute" min="0" max="59" style="width:40px" />
              </div>
            </div>
          </div>
          <div class="s-group">
            <div class="s-label">啟用</div>
            <div class="s-row"><label><input type="checkbox" id="reminderEnabled" /> 事前 60/30 分鐘提醒</label></div>
            <div class="s-row"><label><input type="checkbox" id="reflectEnabled" /> 晚報</label></div>
            <div class="s-row"><label><input type="checkbox" id="weeklyEnabled" /> 週日回顧</label></div>
          </div>
        </div>

        <!-- AI 交流設定 -->
        <div class="stab-content" id="tab-aitalk">
          <div class="s-group">
            <div class="s-section-head">
              <div class="s-label">AI 頻道規則</div>
              <button class="btn-sm" id="addChannelTypeBtn">＋ 新增頻道</button>
            </div>
            <p class="pwd-hint">每個頻道類型可設定獨立的 AI 規則，留空代表使用預設。</p>
            <div id="channelTypesList"></div>
          </div>
          <div class="s-group">
            <div class="s-section-head">
              <div class="s-label">Discord 伺服器</div>
              <button class="btn-sm" id="addServerBtn">＋ 新增伺服器</button>
            </div>
            <div id="discordServersList"></div>
          </div>
        </div>

        <!-- 安全 -->
        <div class="stab-content" id="tab-security">
          <div class="s-group">
            <div class="s-label">網頁密碼</div>
            <p class="pwd-hint" style="margin-bottom:12px">設定後每次開啟頁面需要輸入密碼。留空代表清除密碼。</p>
            <div class="pwd-row">
              <input type="password" id="newPassword" placeholder="新密碼（留空=清除）" autocomplete="new-password" />
              <button class="btn-ghost" id="savePassword">設定</button>
            </div>
            <div id="pwdStatus" class="pwd-hint"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- 鎖定畫面 -->
  <div class="lock-screen" id="lockScreen" hidden>
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <div class="lock-title">手帳 · ChatCal</div>
      <input type="password" id="lockPwd" placeholder="密碼" autocomplete="current-password" />
      <button id="lockBtn">解鎖</button>
      <div class="lock-err" id="lockErr"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
    }
  </script>
</body>
</html>
